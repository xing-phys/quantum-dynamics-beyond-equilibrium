<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="485" viewBox="0 0 1000 485"><rect width="100%" height="100%" fill="#fffdf9"/><g font-family="DejaVu Sans,Arial,sans-serif" fill="#273946"><text x="35" y="38" font-size="22" fill="#27627c" text-anchor="start">DETERMINISTIC APERIODIC WORDS AND THEIR PHYSICAL CLOCK</text><text x="45" y="100" font-size="21" fill="#27627c" text-anchor="start">Fibonacci: A → AB, B → A</text><text x="60" y="164" font-size="20" fill="#273946" text-anchor="start">A</text><text x="60" y="198" font-size="20" fill="#273946" text-anchor="start">AB</text><text x="60" y="232" font-size="20" fill="#273946" text-anchor="start">ABA</text><text x="60" y="266" font-size="20" fill="#273946" text-anchor="start">ABAAB</text><text x="60" y="300" font-size="20" fill="#273946" text-anchor="start">ABAABABA</text><text x="540" y="100" font-size="21" fill="#c2654b" text-anchor="start">Thue–Morse: A → AB, B → BA</text><text x="555" y="164" font-size="20" fill="#273946" text-anchor="start">A</text><text x="555" y="198" font-size="20" fill="#273946" text-anchor="start">AB</text><text x="555" y="232" font-size="20" fill="#273946" text-anchor="start">ABBA</text><text x="555" y="266" font-size="20" fill="#273946" text-anchor="start">ABBABAAB</text><text x="555" y="300" font-size="20" fill="#273946" text-anchor="start">ABBABAABBAABABBA</text><text x="500" y="365" font-size="19" fill="#273946" text-anchor="middle">One symbol = one microscopic gate interval</text><text x="500" y="410" font-size="18" fill="#273946" text-anchor="middle">Substitution level n counts a growing block, not one unit of time.</text><text x="500" y="448" font-size="18" fill="#273946" text-anchor="middle">Uniform-time moments must include the intermediate prefixes.</text></g></svg>