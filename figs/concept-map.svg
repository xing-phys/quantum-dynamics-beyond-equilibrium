<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520"><rect width="100%" height="100%" fill="#fffdf9"/><g font-family="DejaVu Sans,Arial,sans-serif" fill="#273946"><text x="45" y="38" font-size="24" fill="#27627c" text-anchor="start">ONE EVOLUTION · DIFFERENT QUESTIONS</text><rect x="330" y="65" width="340" height="85" rx="9" fill="#f0f5f5" stroke="#27627c" stroke-width="1.5"/><text x="500.0" y="97" font-size="19" fill="#27627c" text-anchor="middle">Global state and unitary dynamics</text><text x="500.0" y="125" font-size="13" fill="#273946" text-anchor="middle">Specify initial state, Hamiltonian, and record</text><line x1="390" y1="150" x2="165" y2="215" stroke="#78858b" stroke-width="1.5" stroke-dasharray=""/><line x1="500" y1="150" x2="500" y2="215" stroke="#78858b" stroke-width="1.5" stroke-dasharray=""/><line x1="610" y1="150" x2="835" y2="215" stroke="#78858b" stroke-width="1.5" stroke-dasharray=""/><text x="110" y="195" font-size="14" fill="#273946" text-anchor="start">measure bath</text><text x="435" y="195" font-size="14" fill="#273946" text-anchor="start">sample times</text><text x="750" y="195" font-size="14" fill="#273946" text-anchor="start">retain input/output</text><rect x="30" y="215" width="270" height="85" rx="9" fill="#f0f5f5" stroke="#27627c" stroke-width="1.5"/><text x="165.0" y="247" font-size="19" fill="#27627c" text-anchor="middle">Projected ensemble</text><text x="165.0" y="275" font-size="13" fill="#273946" text-anchor="middle">Conditional states and Born weights</text><line x1="165" y1="300" x2="165" y2="357" stroke="#78858b" stroke-width="1.5" stroke-dasharray=""/><rect x="30" y="357" width="270" height="85" rx="9" fill="#f0f5f5" stroke="#27627c" stroke-width="1.5"/><text x="165.0" y="389" font-size="19" fill="#27627c" text-anchor="middle">Average over outcomes</text><text x="165.0" y="417" font-size="13" fill="#273946" text-anchor="middle">Reduced density matrix</text><rect x="365" y="215" width="270" height="85" rx="9" fill="#f0f5f5" stroke="#27627c" stroke-width="1.5"/><text x="500.0" y="247" font-size="19" fill="#27627c" text-anchor="middle">Temporal ensemble</text><text x="500.0" y="275" font-size="13" fill="#273946" text-anchor="middle">States along one trajectory</text><line x1="500" y1="300" x2="500" y2="357" stroke="#78858b" stroke-width="1.5" stroke-dasharray=""/><rect x="365" y="357" width="270" height="85" rx="9" fill="#f0f5f5" stroke="#27627c" stroke-width="1.5"/><text x="500.0" y="389" font-size="19" fill="#27627c" text-anchor="middle">Average over time</text><text x="500.0" y="417" font-size="13" fill="#273946" text-anchor="middle">Time-averaged density matrix</text><rect x="700" y="215" width="270" height="85" rx="9" fill="#f0f5f5" stroke="#27627c" stroke-width="1.5"/><text x="835.0" y="247" font-size="19" fill="#27627c" text-anchor="middle">Channels and processes</text><text x="835.0" y="275" font-size="13" fill="#273946" text-anchor="middle">Maps and multi-time memory</text><line x1="835" y1="300" x2="835" y2="357" stroke="#78858b" stroke-width="1.5" stroke-dasharray=""/><rect x="700" y="357" width="270" height="85" rx="9" fill="#f0f5f5" stroke="#27627c" stroke-width="1.5"/><text x="835.0" y="389" font-size="19" fill="#27627c" text-anchor="middle">Discard record or history</text><text x="835.0" y="417" font-size="13" fill="#273946" text-anchor="middle">Coarser dynamical description</text><text x="500" y="490" font-size="18" fill="#273946" text-anchor="middle">Higher moments reveal information lost by averaging.</text></g></svg>